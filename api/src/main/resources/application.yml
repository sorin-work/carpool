spring:
  application:
    name: carpool
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5442/carpool}
    username: ${DATABASE_USER:carpool}
    password: ${DATABASE_PASSWORD:carpool}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Must be at least 32 characters. Override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    ttl: ${JWT_TTL:7d}
  # Creates demo@carpool.local / demo-password with sample groups and rides.
  seed-demo: ${SEED_DEMO:false}
