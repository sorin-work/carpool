spring:
  application:
    name: carpool
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5442/carpool}
    username: ${DATABASE_USER:carpool}
    password: ${DATABASE_PASSWORD:carpool}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
