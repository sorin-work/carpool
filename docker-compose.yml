name: carpool

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpool}
      POSTGRES_DB: ${POSTGRES_DB:-carpool}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5442}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
