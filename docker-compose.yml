name: carpool

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpool}
      POSTGRES_DB: ${POSTGRES_DB:-carpool}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5442}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-carpool}
      DATABASE_USER: ${POSTGRES_USER:-carpool}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-carpool}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4419}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
